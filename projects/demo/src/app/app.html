<header class="page-hero">
  <div>
    <p class="eyebrow">{{ 'demo.hero.eyebrow' | translate }}</p>
    <h1>{{ 'demo.hero.title' | translate }}</h1>
    <p>{{ 'demo.hero.description' | translate }}</p>
  </div>
  <div class="page-hero-actions">
    <p-selectbutton class="lang-switcher" [options]="languages" [ngModel]="currentLang()"
                     (ngModelChange)="switchLanguage($event)"
                     [pTooltip]="'demo.langSwitcher.label' | translate" tooltipPosition="left" />
    <primeng-preset-selector
        [presets]="themePresets"
        [selected]="basePreset"
        [label]="'demo.presetSelector.label' | translate"
        (presetSelected)="onPresetSelected($event)" />
    <button pButton type="button" rounded icon="pi pi-palette"
            class="open-theme-designer"
            [attr.aria-label]="'demo.openDesigner' | translate"
            [pTooltip]="'demo.openDesigner' | translate"
            tooltipPosition="left"
            (click)="openThemeDesigner()"></button>
  </div>
</header>

<main>
  <primeng-component-showcase (editTheme)="selectComponent($event)">
    <primeng-showcase-section title="CustomTest" anchor="customtest" (editTheme)="selectComponent($event)">
      <!--suppress CssUnresolvedCustomProperty -->
      <i style="color: var(--p-test-color)">{{ 'demo.customTest.content' | translate }}</i>
    </primeng-showcase-section>

  </primeng-component-showcase>
</main>

@if (showThemeDesigner && pngTheme) {
  <primeng-theme-designer class="primeng-theme-designer"
                      [initialTheme]="pngTheme"
                      [basePreset]="basePreset"
                      [activeSection]="activeDesignerSection"
                      [(collapsed)]="designerCollapsed"
                      (closed)="closeThemeDesigner()"
                      (openDemoPage)="onDemoPage()"
                      (componentSectionSelected)="selectComponent(anchorForThemeKey($event))" />
}
