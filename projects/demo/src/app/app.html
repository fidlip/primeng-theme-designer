<header class="page-hero">
  <div>
    <p class="eyebrow">PrimeNG 19 theme playground</p>
    <h1>Component showcase</h1>
    <p>All visual PrimeNG components with mock data, ordered alphabetically. Use the palette icon to edit the matching component tokens.</p>
  </div>
  <button pButton type="button" rounded icon="pi pi-palette"
          class="open-theme-designer"
          aria-label="Open theme designer"
          pTooltip="Open theme designer"
          tooltipPosition="left"
          (click)="openThemeDesigner()"></button>
</header>

<main>
  <demo-component-showcase (editTheme)="openDesigner($event)" />
</main>

@if (showThemeDesigner && pngTheme) {
  <primeng-theme-designer class="primeng-theme-designer"
                      [initialTheme]="pngTheme"
                      [activeSection]="activeDesignerSection"
                      [(collapsed)]="designerCollapsed"
                      (closed)="closeThemeDesigner()"
                      (openDemoPage)="showDemoComponent()"
                      (componentSectionSelected)="showDemoComponent($event)" />
}
