<p-fieldset class="w-full mb-3" [legend]="header" [toggleable]="true" [collapsed]="collapsed"
            [motionOptions]="{duration: 0}" (collapsedChange)="onCollapsedChange($event)">
  @if (expanded) {
    <div class="ptd-section-grid">
      @for (entry of sectionConfig | keyvalue:null; track entry.key) {
        @let fullEntryKey = key + '.' + entry.key;
        <ptd-section-content
          [class.ptd-section-wide]="entry.value | isJson"
          [header]="entry.key"
          [owner]="sectionConfig"
          [propertyKey]="entry.key"
          [key]="fullEntryKey">
          @if (entry.value | isJson) {
            <ptd-next-level-section [sectionConfig]="entry.value" [header]="entry.key|titlecase" [key]="fullEntryKey"
                                    [collapsed]="(sectionConfig | keyvalue:null).length > maximumUnfoldedSections">
            </ptd-next-level-section>
          }

        </ptd-section-content>

      }
    </div>
  }
</p-fieldset>
