<p-fieldset class="w-full mb-3" [legend]="header" [toggleable]="true" [collapsed]="collapsed">
  <div class="png-section-grid">
    @for (entry of sectionConfig | keyvalue:null; track entry.key) {
      @let fullEntryKey = key + '.' + entry.key;
      <png-section-content
        [class.png-section-wide]="entry.value | isJson"
        [header]="entry.key"
        [owner]="sectionConfig"
        [propertyKey]="entry.key"
        [key]="fullEntryKey">
        @if (entry.value | isJson) {
          <png-next-level-section [sectionConfig]="entry.value" [header]="entry.key|titlecase" [key]="fullEntryKey"
                                  [collapsed]="(sectionConfig | keyvalue:null).length > maximumUnfoldedSections">
          </png-next-level-section>
        }

      </png-section-content>

    }
  </div>
</p-fieldset>
