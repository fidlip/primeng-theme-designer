<div #wrapper class="png-theme-value-picker">
  <label class="png-theme-value-picker__label" [for]="inputId" (dblclick)="copyTokenPath()" title="Double-click to copy the token path">
    <span>{{ label }}</span>
    <png-value-preview [value]="inputText" [data]="tokenTree">&nbsp;→&nbsp;</png-value-preview>
  </label>
  <input
    #input
    pInputText
    autocomplete="off"
    class="png-theme-value-picker__input"
    [id]="inputId"
    [(ngModel)]="inputText"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [pSize]="'small'"
    (input)="filterTokens($event)"
    (click)="filterTokens($event)"
    (keyup.arrowLeft)="filterTokens($event)"
    (keyup.arrowRight)="filterTokens($event)"
    (blur)="onInputBlur()"
  />
</div>
<p-popover #popover [dismissable]="true">
  <div class="png-theme-value-picker__popover-content">
    @for (token of filteredTokens; track token.path) {
      <button type="button" class="png-theme-value-picker__item"
              [class.png-theme-value-picker__item--selected]="selectedTokenIndex === $index"
              (click)="onTokenSelected(token)">
        <span>{{ token.path }}</span>
        @if (token.valuePreview) {
          <png-value-preview class="png-theme-value-picker__item-preview" [value]="'{' + token.path + '}'" [data]="tokenTree" />
        }
      </button>
    } @empty {
      <span class="png-theme-value-picker__placeholder">No tokens to display</span>
    }
  </div>
</p-popover>
