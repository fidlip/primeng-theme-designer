@if (key) {
  @if (sectionConfig | isPalette) {
    <png-palette-section class="png-theme-palette" [header]="header" [palette]="sectionConfig"
                         [keyBase]="key"></png-palette-section>
  } @else if (sectionConfig | isJson) {
    <ng-content></ng-content>
  } @else {
    <p-ifta-label class="png-theme-value-field">
      <png-theme-value-picker
        [inputId]="'png-theme-field-' + key"
        [label]="header | camelToTokens"
        [placeholder]="'Select a value for ' + (header | camelToTokens)"
        [(ngModel)]="owner[propertyKey]"
        [name]="key"
        [tokenTree]="(availableTokensTree | async) ?? []"
        [tokens]="(availableTokens | async) ?? []"
      />
    </p-ifta-label>
  }


}
